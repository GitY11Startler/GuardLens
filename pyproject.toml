[project]
name = "guardlens"
version = "0.1.0"
description = "Defensive guardrail detectors for prompt injection / jailbreaks, plus a benchmark of those detectors."
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.15",
    "torchvision>=0.29",
    "pydantic>=2",
    "pydantic-settings>=2",
    "datasets>=5.2.0",
    "pyyaml>=6.0.3",
    "datasketch>=2.0.0",
    "sentence-transformers>=6.3.0",
    "scikit-learn>=1.9.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "transformers>=5.22.2",
    "anthropic>=2.8.0",
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
gl = "guardlens.cli:main"

[dependency-groups]
demo = [
    "gradio>=6.32.0",
]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0.12.20261111",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guardlens"]

# --- PyTorch: CUDA 13.2 wheels from the official PyTorch index -------------
# `explicit = true` means only the packages mapped below come from this index;
# everything else still comes from PyPI.
[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

# --- Quality tools ----------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
# Hand-formatted on purpose: D0's regex rules read better unbroken; env_check.py has the
# owner's own edits; data/loaders.py is kept byte-identical to the code that built data v2
# (it was missing from git until M6, see M6_result.md).
exclude = [
    "src/guardlens/detectors/d0_heuristic.py",
    "src/guardlens/env_check.py",
    "src/guardlens/data/loaders.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Regex rules read better unbroken.
"src/guardlens/detectors/d0_heuristic.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not gpu'"
markers = ["gpu: needs a CUDA GPU (run with `uv run pytest -m gpu`)"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
